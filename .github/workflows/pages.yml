name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.29.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run site:build
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables). Both unset: no tracker.
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          # Donation page (repository variable, https URL): a heart button in the header and the footer. Unset: no button.
          PUBLIC_DONATION_URL: ${{ vars.PUBLIC_DONATION_URL }}
          # Legal notice facts (repository variables): a missing one shows a marker on the page and a build warning.
          LEGAL_CONTACT_EMAIL: ${{ vars.LEGAL_CONTACT_EMAIL }}
          LEGAL_PUBLISHER_NAME: ${{ vars.LEGAL_PUBLISHER_NAME }}
          LEGAL_PUBLISHER_FORM: ${{ vars.LEGAL_PUBLISHER_FORM }}
          LEGAL_PUBLISHER_CAPITAL: ${{ vars.LEGAL_PUBLISHER_CAPITAL }}
          LEGAL_PUBLISHER_REGISTRATION: ${{ vars.LEGAL_PUBLISHER_REGISTRATION }}
          LEGAL_PUBLISHER_VAT: ${{ vars.LEGAL_PUBLISHER_VAT }}
          LEGAL_PUBLISHER_ADDRESS: ${{ vars.LEGAL_PUBLISHER_ADDRESS }}
          LEGAL_PUBLICATION_DIRECTOR: ${{ vars.LEGAL_PUBLICATION_DIRECTOR }}
          LEGAL_HOST_NAME: ${{ vars.LEGAL_HOST_NAME }}
          LEGAL_HOST_ADDRESS: ${{ vars.LEGAL_HOST_ADDRESS }}
          LEGAL_HOST_PHONE: ${{ vars.LEGAL_HOST_PHONE }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
